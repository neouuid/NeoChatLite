basePath: /api/v1
definitions:
  github_com_neochat_backend_internal_user.User:
    properties:
      avatar:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      nickname:
        type: string
      phone:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  github_com_neochat_backend_pkg_response.ApiResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  internal_auth.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/github_com_neochat_backend_internal_user.User'
    type: object
  internal_auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  internal_auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  internal_auth.LoginRequest:
    properties:
      identifier:
        description: 用户名、邮箱或手机号
        type: string
      password:
        type: string
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  internal_auth.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  internal_auth.VerifyEmailRequest:
    properties:
      code:
        type: string
    type: object
  internal_chat.CallRecord:
    properties:
      answered_at:
        type: string
      callee:
        $ref: '#/definitions/github_com_neochat_backend_internal_user.User'
      callee_id:
        type: string
      caller:
        allOf:
        - $ref: '#/definitions/github_com_neochat_backend_internal_user.User'
        description: Associations
      caller_id:
        type: string
      conversation_id:
        type: string
      created_at:
        type: string
      duration:
        description: 通话时长（秒）
        type: integer
      ended_at:
        type: string
      id:
        type: string
      started_at:
        type: string
      status:
        description: calling, in_progress, completed, missed, rejected, cancelled
        type: string
      type:
        description: video, voice
        type: string
      updated_at:
        type: string
    type: object
  internal_chat.Conversation:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      last_message:
        type: string
      last_msg_at:
        type: string
      members:
        description: Associations
        items:
          $ref: '#/definitions/internal_chat.ConversationMember'
        type: array
      name:
        type: string
      type:
        description: single, group
        type: string
      updated_at:
        type: string
    type: object
  internal_chat.ConversationMember:
    properties:
      conversation_id:
        type: string
      id:
        type: string
      joined_at:
        type: string
      last_read_at:
        type: string
      muted:
        type: boolean
      nickname:
        type: string
      role:
        description: member, admin, owner
        type: string
      unread_count:
        type: integer
      user:
        allOf:
        - $ref: '#/definitions/github_com_neochat_backend_internal_user.User'
        description: Associations
      user_id:
        type: string
    type: object
  internal_chat.Favorite:
    properties:
      created_at:
        type: string
      id:
        type: string
      message:
        allOf:
        - $ref: '#/definitions/internal_chat.Message'
        description: Associations
      message_id:
        type: string
      note:
        type: string
      user_id:
        type: string
    type: object
  internal_chat.Group:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      max_members:
        type: integer
      member_count:
        description: Not stored in DB, populated dynamically
        type: integer
      name:
        type: string
      owner_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_chat.Mention:
    properties:
      created_at:
        type: string
      has_read:
        type: boolean
      id:
        type: string
      message:
        allOf:
        - $ref: '#/definitions/internal_chat.Message'
        description: Associations
      message_id:
        type: string
      read_at:
        type: string
      user:
        $ref: '#/definitions/github_com_neochat_backend_internal_user.User'
      user_id:
        type: string
    type: object
  internal_chat.Message:
    properties:
      content:
        type: string
      conversation_id:
        type: string
      created_at:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      id:
        type: string
      is_edited:
        type: boolean
      media_url:
        type: string
      mentions:
        items:
          $ref: '#/definitions/internal_chat.Mention'
        type: array
      read_count:
        description: Not stored in DB, populated dynamically
        type: integer
      reply_to:
        $ref: '#/definitions/internal_chat.Message'
      reply_to_id:
        type: string
      sender:
        allOf:
        - $ref: '#/definitions/github_com_neochat_backend_internal_user.User'
        description: Associations
      sender_id:
        type: string
      total_count:
        type: integer
      type:
        description: text, image, file, system
        type: string
      updated_at:
        type: string
    type: object
  internal_user.Blocklist:
    properties:
      blocked:
        allOf:
        - $ref: '#/definitions/internal_user.User'
        description: Associations
      blocked_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      reason:
        type: string
      user_id:
        type: string
    type: object
  internal_user.Friend:
    properties:
      alias:
        type: string
      created_at:
        type: string
      friend:
        $ref: '#/definitions/internal_user.User'
      friend_id:
        type: string
      id:
        type: string
      status:
        description: pending, accepted, blocked
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/internal_user.User'
        description: Associations
      user_id:
        type: string
    type: object
  internal_user.User:
    properties:
      avatar:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      nickname:
        type: string
      phone:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: NeoChat
  description: NeoChat 跨平台聊天服务端 API。客户端在 Authorization 头里携带 "Bearer {token}"。
  title: NeoChat API
  version: "1.0"
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: 已登录用户修改密码
      parameters:
      - description: 密码信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - auth
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 发送验证码到邮箱以重置密码
      parameters:
      - description: 邮箱信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      summary: 忘记密码
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名/邮箱/手机号和密码登录
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      summary: 用户登录
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 清除用户的认证状态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      summary: 用户登出
      tags:
      - auth
  /api/v1/auth/me:
    get:
      consumes:
      - application/json
      description: 获取已登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息（含 id/username/email/nickname/avatar 等）
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - auth
  /api/v1/auth/profile:
    get:
      consumes:
      - application/json
      description: 获取已登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息（含 id/username/email/nickname/avatar 等）
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用刷新令牌获取新的访问令牌
      parameters:
      - description: 刷新令牌
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      summary: 刷新访问令牌
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 创建新用户账户
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      summary: 用户注册
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: 使用验证码重置密码
      parameters:
      - description: 重置密码信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      summary: 重置密码
      tags:
      - auth
  /api/v1/auth/send-verification-email:
    post:
      consumes:
      - application/json
      description: 向已登录用户发送邮箱验证邮件
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 发送邮箱验证邮件
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: 使用验证码验证邮箱
      parameters:
      - description: 验证码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      summary: 验证邮箱
      tags:
      - auth
  /api/v1/blocklist:
    get:
      consumes:
      - application/json
      description: 获取当前用户的黑名单列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_user.Blocklist'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取黑名单
      tags:
      - block
    post:
      consumes:
      - application/json
      description: 将用户加入黑名单
      parameters:
      - description: 拉黑信息
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_user.Blocklist'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 拉黑用户
      tags:
      - block
  /api/v1/blocklist/{id}:
    delete:
      consumes:
      - application/json
      description: 将用户从黑名单移除
      parameters:
      - description: 被拉黑用户ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 取消拉黑
      tags:
      - block
  /api/v1/calls:
    get:
      consumes:
      - application/json
      description: 获取当前用户的通话记录
      parameters:
      - default: 50
        description: 记录数量限制
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_chat.CallRecord'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取通话记录列表
      tags:
      - call
  /api/v1/calls/{id}:
    get:
      consumes:
      - application/json
      description: 获取指定通话的详细信息
      parameters:
      - description: 通话ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_chat.CallRecord'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取通话记录
      tags:
      - call
  /api/v1/calls/{id}/accept:
    post:
      consumes:
      - application/json
      description: 接受来电
      parameters:
      - description: 通话ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_chat.CallRecord'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 接受通话
      tags:
      - call
  /api/v1/calls/{id}/end:
    post:
      consumes:
      - application/json
      description: 挂断当前通话
      parameters:
      - description: 通话ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 结束通话
      tags:
      - call
  /api/v1/calls/{id}/reject:
    post:
      consumes:
      - application/json
      description: 拒绝来电
      parameters:
      - description: 通话ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 拒绝通话
      tags:
      - call
  /api/v1/calls/initiate:
    post:
      consumes:
      - application/json
      description: 向指定用户发起视频或语音通话
      parameters:
      - description: 通话信息
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_neochat_backend_pkg_response.ApiResponse'
            - properties:
