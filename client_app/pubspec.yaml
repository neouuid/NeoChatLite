name: neochat_app
description: NeoChat 跨平台客户端（骨架）——基于 client_sdk/dart 生成的 API 契约层。
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  neochat_api:
    path: ../client_sdk/dart
  file_picker: ^8.0.0
  path_provider: ^2.1.4
  video_player: ^2.9.2
  just_audio: ^0.9.42
  record: ^5.1.2
  cross_file: ^0.3.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
