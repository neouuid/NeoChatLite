server:
  port: 18085
  read_timeout: 30
  write_timeout: 30
  log_level: warn
  auth_rate_limit_per_minute: 1000
  cors:
    allow_origins:
      - "*"
    allow_methods: [GET, POST, PUT, DELETE, OPTIONS]
    allow_headers: ["*"]
database:
  driver: postgres
  host: 127.0.0.1
  port: 15432
  user: postgres
  password: neochat_dev_pw
  dbname: neochat
  sslmode: disable
  max_idle_conns: 2
  max_open_conns: 5
jwt:
  secret: "postgres-e2e-secret-key-0123456789abcd"
  expiry_hour: 24
storage:
  upload_dir: ./uploads
  max_file_size: 104857600
  max_image_size: 10485760
  allowed_image_types: [image/jpeg, image/png]
  allowed_file_types: [text/plain, application/pdf]
redis:
  host: 127.0.0.1
  port: 6379
